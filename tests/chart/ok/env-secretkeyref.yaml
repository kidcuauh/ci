# env literal no secreto y valueFrom.secretKeyRef a Secrets de la lista permitida (CNPG y Percona); la referencia queda exenta de la denylist de nombres y no sale ningún Secret.
# afirma: .[] | select(.kind == "Deployment") | (.spec.template.spec.containers[0].env[0].name == "LOG_LEVEL" and .spec.template.spec.containers[0].env[0].value == "info")
# afirma: .[] | select(.kind == "Deployment") | (.spec.template.spec.containers[0].env[1].name == "DB_PASS" and .spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name == "mi-db-app" and .spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key == "password")
# afirma: .[] | select(.kind == "Deployment") | .spec.template.spec.containers[0].env[2].valueFrom.secretKeyRef.name == "mi-mongo-custom-user-secret"
# afirma: [.[] | select(.kind == "Secret")] | length == 0
env:
  - name: LOG_LEVEL
    value: info
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: mi-db-app
        key: password
  - name: MONGO_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mi-mongo-custom-user-secret
        key: password
