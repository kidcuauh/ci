# Release sin web: solo un worker; no salen Service, Ingress ni el Deployment web.
# afirma: [.[] | select(.kind == "Service" or .kind == "Ingress")] | length == 0
# afirma: [.[] | select(.kind == "Deployment")] | length == 1
# afirma: .[] | select(.kind == "Deployment") | .metadata.name == "mi-app-cola"
web:
  enabled: false
  probes: null
  resources: null
workers:
  - name: cola
    command: [node, worker.js]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}
