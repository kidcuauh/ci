# Base de los casos: una app web mínima válida. Los casos se mezclan encima con
# helm -f base.yaml -f caso.yaml (mapas se mezclan, listas se reemplazan, null borra la clave).
image:
  repository: ghcr.io/mi-org/mi-app
  tag: "1.2.3"
priorityClassName: tenant-dev
web:
  probes:
    readiness:
      httpGet:
        path: /healthz
    liveness:
      httpGet:
        path: /healthz
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
