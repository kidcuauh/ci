# ClusterRole con el que la plataforma deja reconciliar a cada tenant (solo por
# RoleBinding en su namespace). Lo usan las pruebas del chart (todo kind que
# renderiza debe tener create aquí) y el e2e (el tenant aplica su infra/ con él).
# Fuera a propósito: RBAC, NetworkPolicy, cuotas, endpoints, tokens y exec de pods,
# DaemonSet, las fuentes de Flux que no son OCIRepository y los kinds de Infisical
# que no son InfisicalStaticSecret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-reconciler
rules:
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts, persistentvolumeclaims, pods, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secrets.infisical.com]
    resources: [infisicalstaticsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events, endpoints, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
