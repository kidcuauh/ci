{{- range $w := .Values.workers }}
{{- $comp := dict "ctx" $ "component" (printf "worker-%s" $w.name) }}
{{- $replicas := 1 }}
{{- if hasKey $w "replicas" }}{{ $replicas = int $w.replicas }}{{ end }}
{{- $strategy := default "RollingUpdate" $w.strategy }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $.Release.Name $w.name }}
  labels:
    {{- include "app.labels" $comp | nindent 4 }}
  {{- if $.Values.secrets.infisical.enabled }}
  annotations:
    secrets.infisical.com/auto-reload: "true"
  {{- end }}
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "app.selectorLabels" $comp | nindent 6 }}
  strategy:
    {{- if eq $strategy "Recreate" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "app.podLabels" $comp | nindent 8 }}
    spec:
      {{- include "app.podSpec" (dict "ctx" $ "component" (printf "worker-%s" $w.name) "command" $w.command "args" $w.args "resources" $w.resources "probes" $w.probes "defaultPort" "" "env" $w.env "spread" true "gracePeriod" true) | nindent 6 }}
{{- if ge $replicas 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ printf "%s-%s" $.Release.Name $w.name }}
  labels:
    {{- include "app.labels" $comp | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "app.selectorLabels" $comp | nindent 6 }}
{{- end }}
{{- end }}
