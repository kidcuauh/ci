{{- if .Values.web.enabled }}
{{- $web := .Values.web }}
{{- $comp := dict "ctx" . "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" $comp | nindent 4 }}
  {{- if .Values.secrets.infisical.enabled }}
  annotations:
    secrets.infisical.com/auto-reload: "true"
  {{- end }}
spec:
  replicas: {{ $web.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "app.selectorLabels" $comp | nindent 6 }}
  strategy:
    {{- if eq $web.strategy "Recreate" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "app.podLabels" $comp | nindent 8 }}
    spec:
      {{- $ports := list (dict "name" "http" "containerPort" $web.port "protocol" "TCP") }}
      {{- range $web.extraPorts }}
      {{- $ports = append $ports (dict "name" .name "containerPort" .port "protocol" (default "TCP" .protocol)) }}
      {{- end }}
      {{- include "app.podSpec" (dict "ctx" . "component" "web" "command" $web.command "args" $web.args "resources" $web.resources "probes" $web.probes "defaultPort" "http" "ports" $ports "persistence" true "spread" true "gracePeriod" true) | nindent 6 }}
{{- if ge (int $web.replicas) 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" $comp | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "app.selectorLabels" $comp | nindent 6 }}
{{- end }}
{{- end }}
